name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: legra-ai/github-actions/.github/actions/prepare-cargo-release@main
        id: release

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - id: formatter
        run: |
          IFS= read -r formatter_toolchain < rustfmt-toolchain || exit 1
          printf 'toolchain=%s\n' "$formatter_toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.formatter.outputs.toolchain }}
          components: rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: ./scripts/fmt.sh --check
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: python3 scripts/test-package.py
      - run: python3 scripts/test-commit-policy.py
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features

  publish:
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: legra-ai/github-actions/.github/actions/tag-tested-release@main
        with:
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: legra-ai/github-actions/.github/actions/generate-changelog@main
        with:
          revision: ${{ needs.prepare.outputs.revision }}
          output-file: CHANGELOG_RELEASE.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          body_path: CHANGELOG_RELEASE.md
          draft: true
      - uses: legra-ai/github-actions/.github/actions/publish-tested-crate@main
        with:
          crate: sort-governor
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false
